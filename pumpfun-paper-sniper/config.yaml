# =============================================================================
#  pump.fun PAPER-SNIPER  --  Konfiguration
# =============================================================================
#  Diese Datei steuert den kompletten Bot. Du kannst sie mit jedem Texteditor
#  oeffnen (Notepad, Notepad++, VS Code ...) und Werte aendern.
#
#  WICHTIG:
#   * Nur die Zahl hinter dem Doppelpunkt aendern, nie den Namen davor.
#   * Keine Tabs benutzen, nur Leerzeichen (YAML mag keine Tabs).
#   * Nach dem Speichern den Bot neu starten, damit die Aenderung greift.
#
#  Der Bot fragt NIE nach einem Private Key oder einer Seed Phrase - auch im
#  Echtgeld-Modus nicht. Er signiert grundsaetzlich nichts selbst.
# =============================================================================


# =============================================================================
#  BETRIEBSART  -  die wichtigste Einstellung der ganzen Datei
# =============================================================================
#
#  false = SIMULATION (Standard)
#          Es wird nichts gekauft und nichts verkauft. Der Bot rechnet alles
#          gegen ein virtuelles Guthaben. Kostet nichts.
#
#  true  = ECHTGELD
#          Kaeufe und Verkaeufe gehen wirklich raus, ueber die Bot-Wallet bei
#          PumpPortal. Dafuer muessen in der .env stehen:
#              PUMPPORTAL_API_KEY=...
#              BOT_WALLET_PUBKEY=...
#          Ohne diese beiden Eintraege startet der Bot nicht.
#
live_trading: false


# ---- Konto / Groesse --------------------------------------------------------
start_balance_sol: 10.0        # virtuelles Startguthaben (nur Simulation!)
                               # Im Echtgeld-Modus zaehlt, was wirklich auf der
                               # Bot-Wallet liegt - dieser Wert wird ignoriert.
position_size_sol: 0.15        # Einsatz pro Snipe (gilt in BEIDEN Betriebsarten)
max_open_positions: 10         # mehr Streuung: Memecoins sind Lotterielose,
                               # und man braucht viele, um die seltenen
                               # Gewinner zu erwischen
max_snipes_per_min: 15         # Rate-Limit gegen Overtrading

# ---- Signalfenster ----------------------------------------------------------
signal_window_sec: 10          # so lange beobachten, bevor gekauft wird

# ---- Einstiegs-Filter (alle muessen passen) ---------------------------------
max_token_age_sec: 45          # nur ganz frische Token snipern
min_curve_progress_pct: 1      # nicht bei totem 0%-Start
max_curve_progress_pct: 40     # frueh rein, nicht wenn schon gelaufen
min_net_buy_volume_sol: 1.5    # Kaufdruck im Fenster (aus Reserve-Delta)
min_price_gain_in_window_pct: 8 # Momentum: Preis zieht im Fenster an
max_dev_holding_pct: 10        # Dev-Anteil (aus initialem Dev-Buy)
skip_if_complete: true         # migrierte Token ignorieren

# ---- Ausstieg ---------------------------------------------------------------
#
#  GRUNDGEDANKE: Verluste klein halten, Gewinner laufen lassen.
#
#  Warum das so sein MUSS, nachgerechnet an 115 echten Trades:
#  Bei einer Trefferquote von 16,5 % und einem Ø Verlust von -31 % braucht
#  man einen Ø Gewinn von +159 %, nur um bei null herauszukommen.
#
#     Ø Gewinn  +40 %  ->  noetige Trefferquote 44,0 %   (unerreichbar)
#     Ø Gewinn +100 %  ->  noetige Trefferquote 23,9 %
#     Ø Gewinn +150 %  ->  noetige Trefferquote 17,3 %
#     Ø Gewinn +250 %  ->  noetige Trefferquote 11,2 %
#
#  Ein Take-Profit von 40 % kann bei dieser Trefferquote also gar nicht
#  aufgehen - egal wie gut die Einstiege werden.

hard_time_stop_sec: 600        # 10 Min Obergrenze. Greift praktisch nie
                               # (nur 3 von 115 Trades liefen ueber 60 s) -
                               # der Stillstands-Ausstieg unten macht die
                               # eigentliche Arbeit.
take_profit_pct: 250           # echtes Laeufer-Ziel statt Skalpieren
partial_take_profit_pct: 60    # bei +60 % einen Teil sichern ...
partial_take_profit_size: 0.4  # ... aber nur 40 %, damit 60 % weiterlaufen
stop_loss_pct: 30              # etwas weiter als vorher: Ein-/Ausstieg kosten
                               # allein schon ~10 %, ein 25er-Stop reisst
                               # dadurch bei normalem Rauschen
trailing_activate_pct: 50      # ab +50 % Gewinn Trailing an ...
trailing_distance_pct: 30      # ... mit 30 % Abstand. Das ist das eigentliche
                               # Werkzeug, um Laeufer laufen zu lassen: Es gibt
                               # keine Obergrenze nach oben, nur einen
                               # mitwandernden Boden.
rug_exit_drop_per_tick_pct: 20 # bei ploetzlichem Absturz sofort raus
exit_on_net_sell_flip: true    # wenn Kaufdruck in Nettoverkaeufe kippt -> raus

# ---- Ausfuehrungs-Simulation ------------------------------------------------
#  Diese vier Werte betreffen NUR die Simulation (live_trading: false).
#  Sie bilden nach, was ein echter Trade gekostet haette.
fee_pct: 1.0
slippage_pct: 3.0
simulated_priority_fee_sol: 0.0005
rpc_poll_ms: 400               # Kurs-Refresh fuer offene Positionen.
                               #
                               # 400 ms ist die SINNVOLLE UNTERGRENZE: Solana
                               # erzeugt nur etwa alle 400 ms einen Block.
                               # Wer schneller abfragt, bekommt dieselben
                               # Daten zweimal und verbrennt nur sein
                               # RPC-Kontingent.
                               #
                               # ACHTUNG: Mit der oeffentlichen RPC ist 400 ms
                               # bei vielen Positionen zu schnell - es kommen
                               # dann 429-Fehler, und der Bot arbeitet mit
                               # VERALTETEN Kursen. Das ist schlechter als
                               # 800 ms. Fuer 400 ms brauchst du einen
                               # kostenlosen Helius-/QuickNode-Key in der .env
                               # (siehe README, "Schnellere RPC").


# =============================================================================
#  ECHTGELD-EINSTELLUNGEN  (greifen nur bei live_trading: true)
# =============================================================================
live:

  # --- NOT-AUS ---------------------------------------------------------------
  # Verliert die Bot-Wallet diesen Anteil ihres Startguthabens, verkauft der
  # Bot alle offenen Positionen und beendet sich selbst.
  # 0 = ausgeschaltet (nicht empfohlen).
  max_total_loss_pct: 30

  # --- Auftrags-Parameter ----------------------------------------------------
  # Slippage-Obergrenze, die an PumpPortal uebergeben wird. Das ist NICHT
  # slippage_pct von oben! Hier gilt: zu niedrig = viele Snipes schlagen fehl
  # (kosten aber trotzdem Gebuehren), zu hoch = du bekommst schlechte Kurse.
  # 10-20 % ist beim Sniping ueblich.
  order_slippage_pct: 15

  # Priority Fee pro Transaktion in SOL. Hoeher = deine Transaktion kommt
  # schneller in einen Block. Das ist bei kleinen Positionen der groesste
  # Kostenblock - sie faellt pro Auftrag an, unabhaengig von der Groesse.
  priority_fee_sol: 0.0005

  # --- Bestaetigung ----------------------------------------------------------
  # So lange wartet der Bot darauf, dass ein Auftrag auf der Blockchain
  # ankommt. Er prueft dabei den echten Kontostand der Wallet - die Antwort
  # der Handels-API allein ist keine Garantie, dass es geklappt hat.
  fill_confirm_timeout_sec: 25
  fill_poll_interval_sec: 1.0

  # Es wird nicht gekauft, wenn danach weniger als dieser Betrag auf der
  # Wallet bliebe. Reserve fuer die Transaktionsgebuehren der Verkaeufe -
  # ohne die kaemst du aus deinen Positionen nicht mehr raus.
  min_wallet_balance_sol: 0.02

  # Countdown vor dem ersten echten Trade. In dieser Zeit kannst du mit
  # STRG+C noch abbrechen.
  startup_countdown_sec: 8


# =============================================================================
#  AB HIER: Feineinstellungen. Die Defaults passen fuer den Normalbetrieb.
#  Du musst hier nichts aendern - es ist nur da, falls du spaeter schrauben
#  willst. Jede Zeile ist erklaert.
# =============================================================================
advanced:

  # --- Net-Sell-Flip (gehoert zu exit_on_net_sell_flip oben) ---
  # Der Bot schaut sich an, wie viel SOL in den letzten X Sekunden NETTO in
  # die Bonding Curve geflossen ist. Wird daraus ein Abfluss (= es wird mehr
  # verkauft als gekauft), gilt der Kaufdruck als gekippt.
  net_sell_flip_window_sec: 5.0     # Beobachtungsfenster in Sekunden
  #
  # Die Schwelle richtet sich nach der GROESSE der Kurve, nicht nach einer
  # festen SOL-Zahl. Das war der teuerste Fehler des Bots: Mit den frueheren
  # 0.05 SOL fest lag die Schwelle bei 0.5-1.3 % der Kurve - also blosses
  # Rauschen, das jeder Kleinverkaeufer ausloest.
  # Im Betrieb: 85 von 100 Positionen wurden dadurch nach im Schnitt 5 Sekunden
  # geschlossen, mit Ø -10 % - ungefaehr genau der Gebuehr fuer Ein- und
  # Ausstieg. Take-Profit und Trailing kamen KEIN EINZIGES MAL zum Zug.
  net_sell_flip_threshold_pct: 10   # 10 % des echten SOL in der Kurve muessen
                                    # im Fenster abfliessen. Kleiner setzen =
                                    # empfindlicher (Vorsicht!), groesser =
                                    # traeger.
  net_sell_flip_threshold_sol: 0.05 # absolute Untergrenze fuer winzige Kurven

  # Schonzeit nach dem Kauf: So lange loesen die WEICHEN Ausstiege (Flip,
  # Stillstand) nicht aus. Echte Notfaelle - Rug, Stop-Loss, leergezogene
  # Kurve, Migration - greifen weiterhin sofort.
  # Aus dem Betrieb: 63 von 100 Positionen wurden in unter 5 Sekunden
  # geschlossen, KEINE einzige mit Gewinn, zusammen 94 % des Gesamtverlusts.
  # Bei Ø -15 % Ausstieg ist Halten die bessere Wette: nach unten begrenzt der
  # Stop-Loss auf -30 %, nach oben ist es offen.
  min_hold_before_soft_exit_sec: 15

  # Flip-Fenster und -Schwelle bremsen auch den EINSTIEG: Laeuft der Abverkauf
  # schon, wird nicht gekauft. Sonst kauft der Bot Spitzen, die gerade kippen.

  # --- Plausibilitaetspruefung des Kurven-Accounts ---
  # Bei jeder normalen pump.fun-Kurve gilt eine feste Beziehung:
  #     virtuelles SOL - 30  ==  echtes SOL
  # Beide bewegen sich bei Kauf und Verkauf um denselben Betrag.
  #
  # Stimmt das nicht, ist es entweder eine Kurve mit anderen Parametern oder
  # der Account hat ein anderes Speicherlayout. In beiden Faellen sind ALLE
  # Werte, die der Bot daraus ableitet, wertlos - Preis, Progress und
  # Kaufdruck gleichermassen. Solche Token werden nicht gehandelt.
  #
  # (Im Testbetrieb meldete der Bot bei so einem Token "Progress 2.2 %" und
  #  gleichzeitig "Kaufdruck 24.85 SOL" - bei 2.2 % passen aber nur ~0.5 SOL
  #  in die Kurve. Er kaufte daraufhin Schrott.)
  #
  # Wert = erlaubte Abweichung in SOL. Groesser setzen heisst: mehr Token
  # werden gehandelt, aber mit moeglicherweise unsinnigen Messwerten.
  max_curve_layout_deviation_sol: 1.0

  # --- Liquiditaets-Notausgang ---
  # Der Kurs einer Bonding Curve wird aus den VIRTUELLEN Reserven gerechnet.
  # Auszahlen kann sie beim Verkauf aber hoechstens das ECHTE SOL, das drin
  # liegt. Wird eine Kurve leergezogen, steht der Kurs fast still, waehrend
  # real nichts mehr zu holen ist - der Stop-Loss greift dann nie.
  # (Im Testbetrieb: 9 von 115 Trades, 38 % des Gesamtverlusts. Positionen mit
  #  -4.5 % Kursaenderung, eine sogar mit +5.2 %, und trotzdem wertlos.)
  #
  # Dieser Wert ist die Mindest-Deckung: Wie viel vom rechnerischen Kurswert
  # muss beim Verkauf tatsaechlich ankommen?
  #   1.00 = alles (unrealistisch, Gebuehr und Slippage fehlen immer)
  #   0.92 = normale Reibung bei den Standardwerten
  #   0.60 = Standard hier - alles darunter heisst "Kurve ist leer, sofort raus"
  # Niedriger setzen = spaeter raus. Hoeher als 0.85 nicht sinnvoll, dann
  # loest die normale Reibung den Ausstieg staendig aus.
  min_liquidity_coverage: 0.6

  # --- Nachkaufen bei Staerke ("Pyramiding") ---
  # Laeuft eine Position gut, kann der Bot ein zweites Mal in denselben Token
  # kaufen. Menge und Einsatz werden derselben Position zugeschlagen, der
  # Einstiegspreis wird zum gewichteten Mittel - es bleibt also eine Position
  # mit einem Verkauf.
  #
  # RISIKO, klar gesagt: Das haeuft Kapital in EINEM Token an. Geht er hoch,
  # verdienst du doppelt; ruggt er, verlierst du doppelt. Und Memecoins ruggen
  # meistens. Deshalb steht das Limit auf 2 und nicht hoeher.
  max_entries_per_token: 2     # 1 = Nachkaufen komplett aus
  pyramid_min_gain_pct: 25     # nachgelegt wird NUR, wenn die Position schon
                               # so weit im Plus steht. Eine verlierende
                               # Position zu verbilligen macht dieser Bot nie -
                               # das ist die klassische Art, aus einem kleinen
                               # Verlust einen grossen zu machen.

  # --- Stillstands-Ausstieg ---
  # Passiert nach dieser Zeit immer noch nichts, wird verkauft. Damit darf ein
  # Laeufer bis zu hard_time_stop_sec laufen, waehrend totes Kapital trotzdem
  # zuegig wieder freigegeben wird und einen Positionsplatz raeumt.
  stagnation_after_sec: 90     # 0 = aus
  stagnation_band_pct: 15      # "nichts passiert" = Kurs zwischen -15% und +15%

  # --- Obergrenze fuers Momentum ---
  # Wie weit darf der Kurs im Signalfenster HOECHSTENS gestiegen sein?
  # 0 = keine Obergrenze (Standard).
  # Hintergrund: min_price_gain_in_window_pct (oben) sagt "mindestens 8 %".
  # Nach oben ist es offen - der Bot kauft also auch bei +200 %, und das ist
  # meistens die Spitze eines Spikes, der gleich in sich zusammenfaellt.
  # Wenn du in den Logs viele Kaeufe bei sehr hohem Momentum siehst, die
  # sofort wieder mit FLIP oder RUG schliessen: hier z.B. 60 eintragen.
  max_price_gain_in_window_pct: 0

  # --- Curve-Progress ---
  # progress = 1 - (realTokenReserves / initial_real_token_reserves)
  # 793_100_000_000_000 ist der aktuelle pump.fun-Standardwert (in Basis-
  # einheiten, Token haben 6 Nachkommastellen). Nur aendern, wenn pump.fun
  # die Kurven-Parameter umstellt.
  initial_real_token_reserves: 793100000000000

  # --- Feed ---
  # WebSocket von PumpPortal (kostenlos, kein API-Key noetig).
  pumpportal_ws_url: "wss://pumpportal.fun/api/data"
  # pump.fun-Launches kommen ueber pool "pump". PumpPortal meldet inzwischen
  # auch andere Launchpads (z.B. "bonk"). Deren Bonding Curve hat ein anderes
  # Layout, deshalb ignoriert der Bot sie. Leere Liste = alles zulassen.
  allowed_pools: ["pump"]
  # Reconnect-Backoff in Sekunden (start, maximum)
  ws_reconnect_min_sec: 1.0
  ws_reconnect_max_sec: 30.0

  # --- RPC ---
  rpc_timeout_sec: 10.0        # Timeout pro RPC-Anfrage
  rpc_max_accounts_per_call: 100  # getMultipleAccounts-Limit der meisten RPCs
  rpc_max_consecutive_errors: 50  # danach wird eine Warnung ins Log geschrieben

  # --- Dauerbetrieb ---
  # Haelt Windows waehrend des Laufs wach. Der Bildschirm darf trotzdem
  # ausgehen - nur schlafen legen soll sich der Rechner nicht.
  # Warum das wichtig ist: Im Ruhezustand haelt der Bot an. Im Echtgeld-Modus
  # liegen die offenen Positionen dann ohne Stop-Loss und ohne Zeitstopp auf
  # der Wallet, bis du den PC wieder aufweckst.
  # Nur auf false setzen, wenn du den Ruhezustand bewusst willst.
  prevent_sleep: true

  # --- Aufraeumen ---
  # Kandidaten, die nach dem Signalfenster nicht gekauft wurden, werden
  # verworfen. Dieser Wert ist nur ein Sicherheitsnetz gegen Speicherlecks.
  candidate_max_lifetime_sec: 120

  # --- Dashboard ---
  dashboard_refresh_per_sec: 4 # Bildwiederholrate der Konsolen-Anzeige
  dashboard_max_closed_rows: 8 # so viele der letzten Trades anzeigen
  dashboard_max_log_rows: 6    # so viele Log-Zeilen unten anzeigen

  # --- Dateien (relativ zum Projektordner) ---
  trades_csv: "trades.csv"
  session_log: "session.log"
